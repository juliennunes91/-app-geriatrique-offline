name: Build APK Android

# Deux déclencheurs :
#  - push d'un tag « v1.72 » → build + Release GitHub avec l'APK attaché ;
#  - lancement manuel (workflow_dispatch) → APK en artéfact, pour tester sans
#    publier de version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à embarquer (ex. 1.72)"
        required: false
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3

      - name: Déterminer la version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version }}"
          fi
          # versionCode monotone dérivé du versionName : 1.72 → 17200.
          # awk plutôt que `read` : « read MA MI PA <<< 1.72.0.0 » place tout le
          # reste (« 0.0 ») dans PA et casse l'arithmétique. Les segments absents
          # valent 0.
          CODE=$(awk -v n="$NAME" 'BEGIN{split(n,a,"."); printf "%d", (a[1]+0)*10000 + (a[2]+0)*100 + (a[3]+0)}')
          if [[ -z "$CODE" || "$CODE" -le 0 ]]; then CODE=${GITHUB_RUN_NUMBER}; fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME} (code ${CODE})"

      # Signature release : uniquement si le keystore a été déposé en secret.
      # Sinon le build retombe sur la clé debug (APK installable pour tester).
      - name: Préparer le keystore (si secret présent)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signature release activée."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun secret KEYSTORE_BASE64 — APK signé avec la clé debug (non upgradable vers une future version signée en release)."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: Renommer l'APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="GeriaAssist-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Publier l'artéfact
        uses: actions/upload-artifact@v4
        with:
          name: GeriaAssist-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Créer la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: GeriaAssist ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          body: |
            **Installation** — téléchargez l'APK ci-dessous et ouvrez-le sur votre
            téléphone Android. Autorisez l'installation depuis cette source si
            Android le demande.

            Application entièrement hors ligne : aucune donnée patient ne quitte
            l'appareil. La connexion n'est utilisée que pour vérifier l'existence
            d'une nouvelle version au démarrage.

            Outil d'aide à la décision — tout résultat doit être validé par le
            professionnel de santé.
